name: PhiCloud R0 tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned operator signature verifier
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-operator.txt

      - name: Validate and test local service discovery
        run: |
          python -m compileall -q phicloud tests
          python -m unittest discover -s tests -v

  anc-interoperability:
    name: Pinned ANC -> PhiCloud risk advisory smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out PhiCloud
        uses: actions/checkout@v4
      - name: Check out exact ANC commit (no floating main)
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/ANC
          ref: 3f7c0a083894d8038092f1648d113e8b809b7eee
          path: external-anc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise actual ANC -> PhiCloud advisory boundary
        run: PYTHONPATH=".:external-anc" python tests/anc_contract_smoke.py
